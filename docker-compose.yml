networks:
  nginx-test:
  
services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    networks:
      nginx-test:
    deploy:
      replicas: 3
      
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      
  curl:
    image: curlimages/curl
    restart: no
    networks:
      nginx-test:
